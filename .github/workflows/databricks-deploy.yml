name: "Alice Data Contract CI"

on:
  pull_request:
    branches:
      - homolog
      - main
    paths:
      - "contracts/**"
      - "notebooks/**"

jobs:
  validate-contracts:
    name: "Validar Contratos e Breaking Changes"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout do Repositório"
        uses: actions/checkout@v4

      - name: "Configurar Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: "Instalar CLI Alice (Data Contract)"
        run: |
          python -m pip install --upgrade pip
          pip install "datacontract-cli[databricks]"

      - name: "Lint dos Contratos YAML"
        run: |
          for contract in contracts/*.yaml; do
            echo "A validar sintaxe de: $contract"
            datacontract lint "$contract"
          done

      - name: "Testar Contrato contra Databricks (Homolog)"
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
        run: |
          datacontract test contracts/gold_dp_cnpj_estabelecimentos_360.json
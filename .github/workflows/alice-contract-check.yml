name: "Alice Data Contract CI"

on:
  pull_request:
    branches:
      - homolog
      - main
    paths:
      - "contracts/**"
      - "notebooks/**"
      - ".github/workflows/**"

jobs:
  validate-contracts:
    name: "Validar Contratos e Breaking Changes"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout do Repositório"
        uses: actions/checkout@v4

      - name: "Configurar Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: "Instalar Dependências da CLI e Databricks Connector"
        run: |
          python -m pip install --upgrade pip
          pip install "datacontract-cli[databricks]" databricks-sql-connector

      - name: "Lint dos Contratos JSON"
        run: |
          for contract in contracts/*.json; do
            echo "A validar sintaxe de: $contract"
            datacontract lint "$contract"
          done

      - name: "Higienizar Hostname e Credenciais"
        id: creds
        env:
          RAW_HOST: ${{ secrets.DATABRICKS_HOST }}
          RAW_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          RAW_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
        run: |
          CLEAN_HOST=$(echo "$RAW_HOST" | sed -E 's|^https?://||' | sed -E 's|/.*$||' | xargs)
          CLEAN_TOKEN=$(echo "$RAW_TOKEN" | xargs)
          CLEAN_PATH=$(echo "$RAW_HTTP_PATH" | xargs)

          echo "DATABRICKS_HOST=$CLEAN_HOST" >> "$GITHUB_ENV"
          echo "DATACONTRACT_DATABRICKS_SERVER_HOSTNAME=$CLEAN_HOST" >> "$GITHUB_ENV"
          echo "DATACONTRACT_DATABRICKS_TOKEN=$CLEAN_TOKEN" >> "$GITHUB_ENV"
          echo "DATACONTRACT_DATABRICKS_ACCESS_TOKEN=$CLEAN_TOKEN" >> "$GITHUB_ENV"
          echo "DATACONTRACT_DATABRICKS_HTTP_PATH=$CLEAN_PATH" >> "$GITHUB_ENV"

      - name: "Testar Contrato contra Databricks (Homolog)"
        env:
          DATACONTRACT_DATABRICKS_SERVER_HOSTNAME: ${{ env.DATACONTRACT_DATABRICKS_SERVER_HOSTNAME }}
          DATACONTRACT_DATABRICKS_TOKEN: ${{ env.DATACONTRACT_DATABRICKS_TOKEN }}
          DATACONTRACT_DATABRICKS_ACCESS_TOKEN: ${{ env.DATACONTRACT_DATABRICKS_ACCESS_TOKEN }}
          DATACONTRACT_DATABRICKS_HTTP_PATH: ${{ env.DATACONTRACT_DATABRICKS_HTTP_PATH }}
          DATABRICKS_HOST: ${{ env.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ env.DATACONTRACT_DATABRICKS_TOKEN }}
        run: |
          echo "Conectando ao SQL Warehouse: $DATACONTRACT_DATABRICKS_HTTP_PATH"
          datacontract test contracts/gold_dp_cnpj_estabelecimentos_360.json --server homolog --debug
name: "Alice Data Contract CI"

on:
  pull_request:
    branches:
      - homolog
      - main
    paths:
      - "contracts/**"
      - "notebooks/**"
      - ".github/workflows/**"

jobs:
  validate-contracts:
    name: "Validar Contratos e Breaking Changes"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout do Repositório"
        uses: actions/checkout@v4

      - name: "Configurar Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: "Instalar CLI Alice (Data Contract)"
        run: |
          python -m pip install --upgrade pip
          pip install "datacontract-cli[databricks]"

      - name: "Lint dos Contratos JSON"
        run: |
          for contract in contracts/*.json; do
            echo "Validando sintaxe de: $contract"
            datacontract lint "$contract"
          done

      - name: "Configurar Variaveis Databricks"
        env:
          RAW_HOST: ${{ secrets.DATABRICKS_HOST }}
          RAW_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          RAW_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
        run: |
          # Higieniza o hostname: remove https://, http://, barras e espacos
          CLEAN_HOST=$(echo "$RAW_HOST" | sed -E 's|^https?://||' | sed -E 's|/.*$||' | xargs)
          CLEAN_TOKEN=$(echo "$RAW_TOKEN" | xargs)
          CLEAN_PATH=$(echo "$RAW_HTTP_PATH" | xargs)

          # Grava no GITHUB_ENV para disponibilizar globalmente nos proximos steps
          echo "DATACONTRACT_DATABRICKS_SERVER_HOSTNAME=$CLEAN_HOST" >> $GITHUB_ENV
          echo "DATACONTRACT_DATABRICKS_TOKEN=$CLEAN_TOKEN" >> $GITHUB_ENV
          echo "DATACONTRACT_DATABRICKS_HTTP_PATH=$CLEAN_PATH" >> $GITHUB_ENV

      - name: "Testar Contrato contra Databricks (Homolog)"
        run: |
          echo "Conectando ao Databricks Host: $DATACONTRACT_DATABRICKS_SERVER_HOSTNAME"
          datacontract test contracts/gold_dp_cnpj_estabelecimentos_360.json
name: "Alice Data Contract CI"

on:
  pull_request:
    branches:
      - homolog
      - main
    paths:
      - "contracts/**"
      - "notebooks/**"

jobs:
  validate-contracts:
    name: "Validar Contratos e Breaking Changes"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout do Repositório"
        uses: actions/checkout@v4

      - name: "Configurar Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: "Instalar CLI Alice (Data Contract)"
        run: |
          python -m pip install --upgrade pip
          pip install "datacontract-cli[databricks]"

      - name: "Lint dos Contratos JSON"
        run: |
          for contract in contracts/*.json; do
            echo "Validando sintaxe de: $contract"
            datacontract lint "$contract"
          done

      - name: "Testar Contrato contra Databricks (Homolog)"
        env:
          RAW_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATACONTRACT_DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATACONTRACT_DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
        run: |
          # Higieniza o host removendo https:// e barras finais
          CLEAN_HOSTNAME=$(echo "$RAW_HOST" | sed -e 's|^https://||' -e 's|/$||')
          export DATACONTRACT_DATABRICKS_SERVER_HOSTNAME="$CLEAN_HOSTNAME"

          echo "Executando teste no Databricks Host: $DATACONTRACT_DATABRICKS_SERVER_HOSTNAME"

          # Executa o teste de contrato contra o servidor configurado
          datacontract test contracts/gold_dp_cnpj_estabelecimentos_360.json